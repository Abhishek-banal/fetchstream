services:
  fetchstream-runner:
    build:
      context: ../../
      dockerfile: backend/docker/Dockerfile
    container_name: fetchstream-remote-runner
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - API_KEY=${API_KEY:-}
      - TELEGRAM_API_ID=${TG_API_ID:-}
      - TELEGRAM_API_HASH=${TG_API_HASH:-}
    depends_on:
      - telegram-bot-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TG_API_ID:-}
      - TELEGRAM_API_HASH=${TG_API_HASH:-}
      - TELEGRAM_LOCAL=1
    volumes:
      - telegram-data:/var/lib/telegram-bot-api

volumes:
  telegram-data:
